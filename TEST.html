<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Pages 동작 확인</title>
<style>
  body {
    margin: 0; padding: 40px;
    background: #1A1918; color: #ddd;
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
    line-height: 1.6;
  }
  .box {
    max-width: 640px; margin: 0 auto;
    background: #202024; border-radius: 14px;
    padding: 32px 36px;
  }
  h1 { color: #E0C48A; font-size: 28px; margin: 0 0 18px; }
  .ok { color: #8CC09E; font-weight: 700; }
  code {
    background: #1c1c20; color: #A88FD1;
    padding: 2px 8px; border-radius: 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 14px;
  }
  ul { padding-left: 22px; }
  li { margin: 6px 0; }
  .muted { color: #888; font-size: 13px; margin-top: 24px; }
</style>
</head>
<body>
<div class="box">
  <h1>GitHub Pages 동작 확인 <span class="ok">✓</span></h1>
  <p>이 페이지가 보이면 다음이 모두 정상입니다:</p>
  <ul>
    <li>저장소가 <code>github.io</code> 도메인에서 HTTPS로 서빙됨</li>
    <li>HTML이 <code>text/html</code>로 렌더링됨 (raw 모드 아님)</li>
    <li>iframe 임베드도 가능함 (X-Frame-Options 제한 없음)</li>
  </ul>
  <p class="muted">repo: HongLabInc/HongLabLLM · path: TEST.html</p>
</div>
</body>
</html>
